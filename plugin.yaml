name: hermes-todo-goal
version: 0.1.1
manifest_version: 2
api_version: 1
kind: standalone
author: Ilya Somov
description: "Goal lifecycle control for the current chat session: create, read, update, pause, resume and request verified completion, with an optional todo binding."
